<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>انتخابینو</title><style>body{font:18px Tahoma;background:#f3e8ff;color:#3b0764;text-align:center;padding:20px}main{max-width:600px;margin:auto;background:white;border-radius:24px;padding:20px}textarea{width:95%;height:120px;font:18px Tahoma;border:1px solid #c4b5fd;border-radius:12px;padding:10px}button{font: bold 18px Tahoma;background:#7c3aed;color:white;border:0;border-radius:12px;padding:14px;margin:8px;cursor:pointer}#out{font-size:28px;color:#a21caf;font-weight:bold;margin:20px}#wheel{width:260px;height:260px;border-radius:50%;margin:15px auto;background:conic-gradient(#8b5cf6 0 60deg,#ec4899 60deg 120deg,#f97316 120deg 180deg,#eab308 180deg 240deg,#10b981 240deg 300deg,#06b6d4 300deg);border:8px solid white;box-shadow:0 5px 18px #999}</style><main><h1>🎯 انتخابینو</h1><p>هر گزینه رو در یک خط بنویس:</p><textarea id="names">پارسا
آرین
سارا
مریم
علی</textarea><br><button onclick="pick()">🎡 انتخاب تصادفی</button><button onclick="document.getElementById('names').value='';document.getElementById('out').textContent=''">پاک کردن</button><div id="wheel"></div><div id="out"></div><p>انتخاب تصادفی سریع و ساده!</p></main><script>function pick(){let a=document.getElementById('names').value.split(/\n/).map(x=>x.trim()).filter(Boolean);if(a.length<2){alert('حداقل دو گزینه بنویس!');return}let o=document.getElementById('out');o.textContent='🎉 '+a[Math.floor(Math.random()*a.length)];}</script></html>
