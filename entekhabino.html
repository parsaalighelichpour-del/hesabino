<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>انتخابینو | چرخ شانس</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;font:17px Tahoma;background:radial-gradient(circle at 15% 10%,#fce7f3,transparent 35%),radial-gradient(circle at 90% 20%,#ddd6fe,transparent 38%),linear-gradient(135deg,#faf5ff,#fdf2f8);color:#34204d}.app{max-width:900px;margin:auto}.head{text-align:center;color:#6d28d9}.head h1{font-size:40px;margin:8px}.layout{display:grid;grid-template-columns:1fr 1.15fr;gap:18px}.panel{background:#ffffffdd;border:1px solid white;border-radius:24px;padding:20px;box-shadow:0 14px 40px #6d28d91a}textarea{width:100%;height:180px;border:2px solid #e9d5ff;border-radius:15px;padding:12px;font:17px/1.8 Tahoma;background:#fdfaff;color:#34204d}button{border:0;border-radius:13px;padding:13px 16px;margin:5px;font:bold 15px Tahoma;cursor:pointer}.go{background:linear-gradient(135deg,#8b5cf6,#db2777);color:white}.soft{background:#f3e8ff;color:#6d28d9}.wheelbox{position:relative;width:min(100%,360px);aspect-ratio:1;margin:10px auto 18px;filter:drop-shadow(0 12px 15px #4c1d9522)}canvas{width:100%;height:100%}.pointer{position:absolute;z-index:2;top:-3px;left:50%;transform:translateX(-50%);border-left:19px solid transparent;border-right:19px solid transparent;border-top:36px solid white;filter:drop-shadow(0 2px 3px #5555)}.result{background:linear-gradient(120deg,#f5d0fe,#fce7f3);border-radius:16px;padding:15px;text-align:center;margin-top:10px}.result small{display:block;color:#8b5cf6}.result strong{display:block;font-size:26px;color:#86198f;margin-top:6px;overflow-wrap:anywhere}.hint{color:#78678b;font-size:13px}@media(max-width:700px){.layout{grid-template-columns:1fr}body{padding:12px}.head h1{font-size:32px}}
</style></head><body><main class="app"><header class="head"><h1>🎯 انتخابینو</h1><p>چرخ شانس رنگی و انتخاب تصادفی</p></header><div class="layout"><section class="panel"><h2>✍️ گزینه‌ها</h2><textarea id="items">پارسا
آرین
سارا
مریم
علی</textarea><p class="hint">هر گزینه رو در یک خط بنویس؛ ۲ تا ۳۰ گزینه بهتره.</p><button class="go" id="spin">🎡 بچرخون!</button><button class="soft" id="mix">🔀 قاطی کن</button><button class="soft" id="clear">پاک کردن</button></section><section class="panel"><h2 style="text-align:center">🍀 چرخ شانس</h2><div class="wheelbox"><div class="pointer"></div><canvas id="wheel" width="800" height="800"></canvas></div><div class="result"><small id="msg">آماده‌ای؟</small><strong id="winner">بچرخون تا برنده مشخص شه!</strong></div></section></div></main>
<script>
const cv=document.getElementById('wheel'),c=cv.getContext('2d'),ta=document.getElementById('items'),btn=document.getElementById('spin'),cols=['#8b5cf6','#ec4899','#f97316','#eab308','#10b981','#06b6d4','#6366f1','#f43f5e','#84cc16','#a855f7'];let rot=0,busy=false;
function list(){return ta.value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).slice(0,80)}
function paint(){let a=list(),n=Math.max(1,a.length),arc=2*Math.PI/n;c.clearRect(0,0,800,800);c.save();c.translate(400,400);c.rotate(rot);for(let i=0;i<n;i++){let s=-Math.PI/2+i*arc;c.beginPath();c.moveTo(0,0);c.arc(0,0,375,s,s+arc);c.closePath();c.fillStyle=cols[i%cols.length];c.fill();c.strokeStyle='#fff';c.lineWidth=5;c.stroke();c.save();c.rotate(s+arc/2);c.textAlign='right';c.textBaseline='middle';c.fillStyle='#fff';c.font='bold '+(n>14?22:n>9?27:32)+'px Tahoma';let t=a[i]||'گزینه';if(t.length>17)t=t.slice(0,16)+'…';c.fillText(t,335,0);c.restore()}c.restore()}
ta.addEventListener('input',paint);document.getElementById('clear').onclick=()=>{ta.value='';document.getElementById('winner').textContent='گزینه‌ها رو وارد کن';document.getElementById('msg').textContent='چرخ خالیه';paint()};document.getElementById('mix').onclick=()=>{let a=list();for(let i=a.length-1;i>0;i--){let j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}ta.value=a.join('\n');paint()};
btn.onclick=()=>{let a=list();if(busy)return;if(a.length<2){alert('حداقل دو گزینه وارد کن!');return}busy=true;btn.disabled=true;btn.textContent='در حال چرخش…';document.getElementById('msg').textContent='چرخ داره می‌چرخه!';let idx=Math.random()*a.length|0,arc=2*Math.PI/a.length,goal=-(idx+.5)*arc,cur=((rot%(2*Math.PI))+2*Math.PI)%(2*Math.PI),delta=((goal-cur)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)+Math.PI*2*(6+Math.random()*2),from=rot,to=rot+delta,begin=performance.now(),duration=6000;function tick(now){let t=Math.min(1,(now-begin)/duration),ease=1-Math.pow(1-t,5);rot=from+(to-from)*ease;paint();if(t<1)requestAnimationFrame(tick);else{rot=to;paint();let angle=(((-Math.PI/2-rot+Math.PI/2)%(2*Math.PI))+2*Math.PI)%(2*Math.PI);let landed=Math.min(a.length-1,Math.floor(angle/arc));busy=false;btn.disabled=false;btn.textContent='🎡 دوباره بچرخون!';document.getElementById('msg').textContent='🎉 انتخاب شد';document.getElementById('winner').textContent=a[landed]}}requestAnimationFrame(tick)};paint();
</script></body></html>
