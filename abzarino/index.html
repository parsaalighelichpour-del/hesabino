<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17142d"><title>ابزارینو | جعبه ابزار</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at top right,#493878 0,#211b40 38%,#121126 100%);color:#fff;min-height:100vh;padding:18px 14px 30px}.wrap{max-width:520px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 20px}.brand{font-size:27px;font-weight:800}.sub{font-size:13px;color:#c9c1e8;margin-top:6px}.pill{background:#ffffff18;border:1px solid #ffffff22;border-radius:14px;padding:10px 12px;color:#d8ceff}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.tab{border:1px solid #ffffff20;background:#ffffff12;color:#eee;border-radius:16px;padding:13px;font-size:15px;font-weight:bold}.tab.active{background:linear-gradient(135deg,#a78bfa,#6d5ce7);color:#fff;border:0;box-shadow:0 8px 24px #7c3aed44}.panel{background:#ffffff10;border:1px solid #ffffff22;border-radius:24px;padding:17px;box-shadow:0 14px 40px #08061940;backdrop-filter:blur(16px)}.screen{background:#100e21;border:1px solid #ffffff14;border-radius:18px;min-height:105px;padding:15px;margin-bottom:13px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}#expr{font-size:21px;direction:ltr;text-align:left;overflow-wrap:anywhere;color:#e9e3ff}#result{font-size:27px;font-weight:bold;text-align:left;direction:ltr;color:#b9a6ff;margin-top:8px;min-height:30px}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.key{border:0;border-radius:15px;padding:16px 3px;background:#ffffff13;color:white;font-size:21px;font-weight:600;box-shadow:inset 0 1px #ffffff12}.key:active{transform:scale(.97)}.key.op{background:#6d5ce733;color:#cbbdff}.key.action{background:#ec489933;color:#ffb6d1}.key.equal{background:linear-gradient(135deg,#9b83ff,#6b5ce7);grid-column:span 2}label{display:block;color:#d8cff7;font-size:14px;margin:14px 0 8px}select,input{width:100%;border:1px solid #ffffff25;border-radius:14px;background:#17142d;color:#fff;padding:14px;font-size:16px;outline:none}input{direction:ltr;text-align:left}.convert{display:grid;grid-template-columns:1fr 1fr;gap:10px}.resultbox{margin-top:15px;background:#100e21;border-radius:16px;padding:18px;color:#c7b7ff;font-size:22px;direction:ltr;text-align:center;overflow-wrap:anywhere}.hint{text-align:center;color:#b8afd7;font-size:12px;margin-top:17px;line-height:1.8}
</style></head><body><div class="wrap"><header class="top"><div><div class="brand">🧰 ابزارینو</div><div class="sub">ابزارهای روزمره، همه در یک‌جا</div></div><div class="pill">نسخه ۱.۰</div></header>
<div class="tabs"><button class="tab active" id="calcTab" onclick="show('calc')">🧮 ماشین‌حساب</button><button class="tab" id="unitTab" onclick="show('unit')">📏 تبدیل واحد</button></div>
<section class="panel" id="calc"><div class="screen"><div id="expr">۰</div><div id="result"> </div></div><div class="keys">
<button class="key action" onclick="clearAll()">AC</button><button class="key action" onclick="del()">⌫</button><button class="key op" onclick="add('%')">%</button><button class="key op" onclick="add('/')">÷</button>
<button class="key" onclick="add('7')">۷</button><button class="key" onclick="add('8')">۸</button><button class="key" onclick="add('9')">۹</button><button class="key op" onclick="add('*')">×</button>
<button class="key" onclick="add('4')">۴</button><button class="key" onclick="add('5')">۵</button><button class="key" onclick="add('6')">۶</button><button class="key op" onclick="add('-')">−</button>
<button class="key" onclick="add('1')">۱</button><button class="key" onclick="add('2')">۲</button><button class="key" onclick="add('3')">۳</button><button class="key op" onclick="add('+')">+</button>
<button class="key" onclick="add('0')">۰</button><button class="key" onclick="add('.')">.</button><button class="key equal" onclick="calculate()">=</button></div></section>
<section class="panel" id="unit" style="display:none"><label for="kind">نوع تبدیل</label><select id="kind" onchange="updateUnits()"><option value="length">طول</option><option value="weight">وزن</option><option value="temp">دما</option><option value="volume">حجم</option><option value="time">زمان</option></select>
<div class="convert"><div><label>از</label><select id="from" onchange="convert()"></select></div><div><label>به</label><select id="to" onchange="convert()"></select></div></div><label for="amount">مقدار</label><input id="amount" type="number" value="1" oninput="convert()"><div class="resultbox" id="converted">1</div><div class="hint">مقدار را وارد کن و واحدها را انتخاب کن تا نتیجه فوری نمایش داده شود.</div></section><div class="hint">ابزارینو • ساده، سریع و کاربردی ✨</div></div>
<script>
let expression='';const exprEl=document.getElementById('expr'),resEl=document.getElementById('result');
function show(which){document.getElementById('calc').style.display=which==='calc'?'block':'none';document.getElementById('unit').style.display=which==='unit'?'block':'none';document.getElementById('calcTab').classList.toggle('active',which==='calc');document.getElementById('unitTab').classList.toggle('active',which==='unit')}
function add(v){expression+=v;exprEl.textContent=expression||'۰';resEl.textContent=''}function clearAll(){expression='';exprEl.textContent='۰';resEl.textContent=''}function del(){expression=expression.slice(0,-1);exprEl.textContent=expression||'۰';resEl.textContent=''}
function calculate(){try{if(!expression)return;let safe=expression.replace(/(\d+(?:\.\d+)?)%/g,'($1/100)');if(!/^[0-9+\-*/().\s]+$/.test(safe))throw 0;let n=Function('"use strict";return ('+safe+')')();if(!Number.isFinite(n))throw 0;resEl.textContent=Number(n.toPrecision(12)).toString()}catch(e){resEl.textContent='عبارت نامعتبر'}}
document.addEventListener('keydown',e=>{if(document.getElementById('calc').style.display==='none')return;if('0123456789+-*/().%'.includes(e.key))add(e.key);else if(e.key==='Enter')calculate();else if(e.key==='Backspace')del();else if(e.key==='Escape')clearAll()});
const units={length:{'میلی‌متر':.001,'سانتی‌متر':.01,'متر':1,'کیلومتر':1000,'اینچ':.0254,'فوت':.3048,'مایل':1609.344},weight:{'میلی‌گرم':.000001,'گرم':.001,'کیلوگرم':1,'تن':1000,'پوند':.45359237,'اونس':.0283495},volume:{'میلی‌لیتر':.001,'لیتر':1,'متر مکعب':1000,'قاشق چای‌خوری':.00492892,'فنجان':.236588,'گالن آمریکا':3.78541},time:{'ثانیه':1,'دقیقه':60,'ساعت':3600,'روز':86400,'هفته':604800}};
function updateUnits(){let k=document.getElementById('kind').value,f=document.getElementById('from'),t=document.getElementById('to'),names=k==='temp'?['سلسیوس','فارنهایت','کلوین']:Object.keys(units[k]);f.innerHTML=t.innerHTML='';names.forEach(n=>{f.add(new Option(n,n));t.add(new Option(n,n))});if(names.length>1)t.selectedIndex=1;convert()}
function convertTemp(v,from,to){let c=from==='سلسیوس'?v:from==='فارنهایت'?(v-32)*5/9:v-273.15;return to==='سلسیوس'?c:to==='فارنهایت'?c*9/5+32:c+273.15}
function convert(){let k=document.getElementById('kind').value,from=document.getElementById('from').value,to=document.getElementById('to').value,v=Number(document.getElementById('amount').value);if(!Number.isFinite(v)){document.getElementById('converted').textContent='—';return}let out=k==='temp'?convertTemp(v,from,to):v*units[k][from]/units[k][to];document.getElementById('converted').textContent=Number(out.toPrecision(10)).toLocaleString('en-US',{maximumFractionDigits:10})+' '+to}
updateUnits();
</script></body></html>
